[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esxi-mcp-server"
version = "0.2.0"
description = "VMware ESXi/vCenter Management MCP Server for AI assistants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Bright8192"},
]
keywords = ["mcp", "esxi", "vcenter", "vmware", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyvmomi>=7.0",
    "pyyaml>=6.0",
    "mcp[cli]",
]

[project.scripts]
esxi-mcp-server = "esxi_mcp_server:main"

[project.urls]
Homepage = "https://github.com/Haegiwa405/esxi-mcp-server"
Repository = "https://github.com/Haegiwa405/esxi-mcp-server"
Issues = "https://github.com/Haegiwa405/esxi-mcp-server/issues"
